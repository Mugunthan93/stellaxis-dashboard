<!-- Shared app shell for the localhost dashboard: collect.py wraps every page in this, putting the page at
     the PAGE marker inside <main>. The artifact copies of the pages are published without it. -->
<style>
:root {
  --sx-side-w: 236px;
  --sx-bg: #eceee9; --sx-ink: #17201c; --sx-muted: #5a6560; --sx-line: #d8ddd7;
  --sx-hover: #e2e5df; --sx-active: #dfe6f8; --sx-accent: #2c55c9; --sx-good: #23784a; --sx-warn: #9a6512; --sx-crit: #b63a26;
  --sx-shadow: 0 1px 0 rgb(23 32 28 / 0.04);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sx-bg: #0e1210; --sx-ink: #e6ebe7; --sx-muted: #8f9b94; --sx-line: #252d29;
  --sx-hover: #1a201d; --sx-active: #24304f; --sx-accent: #7c9cf0; --sx-good: #5cc48b; --sx-warn: #e0ad55; --sx-crit: #ef8a76;
  --sx-shadow: none; } }
:root[data-theme="dark"] {
  --sx-bg: #0e1210; --sx-ink: #e6ebe7; --sx-muted: #8f9b94; --sx-line: #252d29;
  --sx-hover: #1a201d; --sx-active: #24304f; --sx-accent: #7c9cf0; --sx-good: #5cc48b; --sx-warn: #e0ad55; --sx-crit: #ef8a76;
  --sx-shadow: none; }

.sx-app { display: grid; grid-template-columns: var(--sx-side-w) minmax(0, 1fr); min-height: 100dvh; }
.sx-skip { position: absolute; left: 12px; top: -48px; z-index: 30; padding: 8px 14px; border-radius: 8px;
  background: var(--sx-accent); color: #fff; font: 600 13px "Instrument Sans", system-ui, sans-serif; text-decoration: none; }
.sx-skip:focus { top: 12px; }

.sx-side { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 22px; padding: 22px 14px 16px;
  background: var(--sx-bg); border-right: 1px solid var(--sx-line); box-shadow: var(--sx-shadow); overflow-y: auto;
  font: 400 14px/1.45 "Instrument Sans", "Helvetica Neue", system-ui, sans-serif; color: var(--sx-ink); z-index: 10; }
.sx-brand { display: grid; gap: 2px; padding: 0 10px; text-decoration: none; color: inherit; }
.sx-brand b { font: 700 1.32rem/1.1 "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif; letter-spacing: -0.02em; }
.sx-brand span { font-size: 0.8rem; color: var(--sx-muted); }

.sx-nav { display: grid; gap: 18px; }
.sx-group { display: grid; gap: 2px; }
.sx-group h2 { margin: 0 0 4px; padding: 0 10px; font: 600 0.72rem/1 "Instrument Sans", system-ui, sans-serif;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--sx-muted); }
.sx-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none;
  color: var(--sx-ink); font-weight: 500; transition: background-color .18s ease, color .18s ease; }
.sx-link svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round; color: var(--sx-muted); transition: color .18s ease; }
.sx-link:hover { background: var(--sx-hover); }
.sx-link:active { transform: translateY(1px); }
.sx-link:focus-visible { outline: 2px solid var(--sx-accent); outline-offset: 2px; }
.sx-link[aria-current="page"] { background: var(--sx-active); color: var(--sx-accent); font-weight: 600; }
.sx-link[aria-current="page"] svg { color: var(--sx-accent); }
.sx-link small { margin-left: auto; font: 400 0.72rem "JetBrains Mono", ui-monospace, monospace; color: var(--sx-muted); }

.sx-foot { margin-top: auto; display: grid; gap: 8px; padding: 12px 10px 0; border-top: 1px solid var(--sx-line); font-size: 0.8rem; color: var(--sx-muted); }
.sx-foot code { font: 400 0.76rem "JetBrains Mono", ui-monospace, monospace; color: var(--sx-ink); }
.sx-status { display: flex; align-items: center; gap: 8px; }
.sx-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sx-muted); flex: none; }
.sx-status[data-state="ok"] .sx-dot { background: var(--sx-good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sx-good) 22%, transparent); }
.sx-status[data-state="busy"] .sx-dot { background: var(--sx-warn); }
.sx-status[data-state="down"] .sx-dot { background: var(--sx-crit); }

.sx-main { min-width: 0; }
.sx-main:focus { outline: none; }
.sx-frame { display: block; width: 100%; height: 100dvh; border: 0; }

@media (max-width: 860px) {
  .sx-app { grid-template-columns: minmax(0, 1fr); }
  .sx-side { position: sticky; height: auto; flex-direction: row; align-items: center; gap: 12px; padding: 10px 16px; overflow-x: auto;
    border-right: 0; border-bottom: 1px solid var(--sx-line); }
  .sx-brand { padding: 0; }
  .sx-brand span, .sx-group h2, .sx-foot, .sx-link small { display: none; }
  .sx-nav { display: flex; gap: 4px; }
  .sx-group { display: flex; gap: 4px; }
  .sx-link { padding: 6px 10px; white-space: nowrap; }
  .sx-frame { height: calc(100dvh - 56px); }
  :root { --sx-side-w: 0px; }
}
@media (prefers-reduced-motion: reduce) { .sx-link, .sx-link svg { transition: none; } }
</style>

<a class="sx-skip" href="#sx-main">Skip to content</a>
<div class="sx-app">
  <aside class="sx-side" aria-label="Stellaxis">
    <a class="sx-brand" href="/">
      <b>Stellaxis</b>
      <span>Home for every project on this Mac</span>
    </a>
    <nav class="sx-nav" aria-label="Pages">
      <div class="sx-group">
        <h2>Workspace</h2>
        <a class="sx-link" href="/" data-match="^/$|^/index(\.html)?$">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M12 13l4-4"/><circle cx="12" cy="13" r="1.4"/><path d="M4 18h16"/></svg>
          Overview</a>
        <a class="sx-link" href="/hierarchy" data-match="^/hierarchy">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3.5" width="7" height="5" rx="1.2"/><rect x="14" y="10" width="7" height="5" rx="1.2"/><rect x="14" y="16.5" width="7" height="4.5" rx="1.2"/><path d="M6.5 8.5v4h7.5M6.5 12.5v6.2h7.5"/></svg>
          Hierarchy</a>
      </div>
      <div class="sx-group">
        <h2>Configure</h2>
        <a class="sx-link" href="/settings" data-match="^/settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          Settings</a>
      </div>
      <div class="sx-group">
        <h2>Knowledge</h2>
        <a class="sx-link" href="/reels/" data-match="^/reels">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 4l2.5 5M13.5 4l2.5 5"/><path d="M10.5 12.5v4.5l3.8-2.25z"/></svg>
          Reels</a>
      </div>
    </nav>
    <div class="sx-foot">
      <div class="sx-status" id="sx-status" data-state="unknown" role="status"><span class="sx-dot"></span><span id="sx-status-text">Collector status…</span></div>
      <div>Projects live in <code>~/code</code></div>
    </div>
  </aside>
  <main class="sx-main" id="sx-main" tabindex="-1">
<!--PAGE-->
  </main>
</div>
<script>
(() => {
  const path = location.pathname;
  for (const a of document.querySelectorAll(".sx-link")) {
    if (new RegExp(a.dataset.match).test(path)) a.setAttribute("aria-current", "page");
  }
  const box = document.getElementById("sx-status"), text = document.getElementById("sx-status-text");
  const ago = iso => {
    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    return s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago";
  };
  async function poll() {
    try {
      const st = await (await fetch("/api/status", { cache: "no-store" })).json();
      const busy = st.phase && st.phase !== "idle";
      box.dataset.state = busy ? "busy" : "ok";
      text.textContent = busy ? "Collecting: " + st.phase : "Collector idle · " + (st.last_snapshot ? "updated " + ago(st.last_snapshot) : "no snapshot yet");
    } catch {
      box.dataset.state = "down";
      text.textContent = "Collector unreachable";
    }
  }
  poll();
  setInterval(poll, 30000);
})();
</script>
